name: Deploy founder admin

on:
  push:
    branches: [main, test]
    paths:
      - 'admin/**'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-founder-admin
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.ADMIN_DATABASE_URL }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
      ADMIN_PASSWORD_SALT: ${{ secrets.ADMIN_PASSWORD_SALT }}
      ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Deploy admin Worker
        run: npm run deploy
      - name: Configure runtime secrets
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const names = ['DATABASE_URL','ADMIN_USERNAME','ADMIN_PASSWORD_HASH','ADMIN_PASSWORD_SALT','ADMIN_SESSION_SECRET'];
          for (const name of names) if (!process.env[name]) throw new Error(`Missing secret: ${name}`);
          fs.writeFileSync('/tmp/fabrica-admin-secrets.json', JSON.stringify(Object.fromEntries(names.map(name => [name, process.env[name]]))), { mode: 0o600 });
          JS
          npx wrangler secret bulk /tmp/fabrica-admin-secrets.json
          rm /tmp/fabrica-admin-secrets.json
